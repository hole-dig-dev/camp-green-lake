name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Install Chromium (for the smoke test)
        run: npx playwright install --with-deps chromium

      - name: Verify the splitter round-trips public/index.html
        # Safe either way: on the current, unsplit public/index.html this checks the mechanical
        # split reproduces it exactly; on an already-split tree it just says so and exits 0. It
        # never writes anything -- the actual split (scripts/split-client.mjs --write) happens
        # once, by hand, after the in-flight feature branches land. See ARCHITECTURE.md.
        run: npm run split:check

      - name: Run the smoke test
        run: npm test

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-screenshot
          path: tests/smoke-failure.png
          if-no-files-found: ignore
