<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camp Green Lake · Camper prototype</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#211b18;color:#f3e8d5;font:15px system-ui,sans-serif}
  main{display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:100vh}
  #stage{position:relative;min-height:650px;background:#c8a376}canvas{display:block;width:100%;height:100%}
  aside{padding:25px;background:#29221d;border-left:1px solid #69523b}
  h1{font-size:26px;margin:0 0 8px}p{line-height:1.45;color:#d7c6ab}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}
  button{border:1px solid #967b55;border-radius:8px;background:#493728;color:#fff2d5;padding:12px 8px;font:inherit;cursor:pointer}
  button:hover,button.on{background:#b46c3d;border-color:#f4ca91;color:#1d1712}
  .note{font-size:13px;margin-top:20px}
  #error{color:#fff;background:#952d2d;padding:10px;display:none}
  @media(max-width:700px){main{display:flex;flex-direction:column}#stage{min-height:56vh;height:56vh}aside{padding:17px;border-left:0;border-top:1px solid #69523b}h1{font-size:20px}.actions{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}button{padding:9px 3px;font-size:13px}.note{margin-top:12px}}
</style>
</head>
<body>
<main>
  <div id="stage"><div id="error"></div></div>
  <aside>
    <h1>Camper prototype</h1>
    <p>A playable model built from low-poly shapes. Pick an action and drag the character to inspect the face and joints.</p>
    <div class="actions" id="actions">
      <button class="on" data-mode="0">Idle</button><button data-mode="1">Walk</button>
      <button data-mode="4">Run</button><button data-mode="2">Dig</button>
      <button data-mode="5">Drink</button><button data-mode="6">Wipe sweat</button>
    </div>
    <p class="note">The prototype uses the game's actual <code>makePerson</code> and <code>animPerson</code> functions. The same model is wired into local and remote player avatars on this branch.</p>
  </aside>
</main>
<div id="labels" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const matCache={};function M(c){return matCache[c]||(matCache[c]=new T.MeshStandardMaterial({color:c,flatShading:true,roughness:0.96}))}
function box(w,h,d,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.castShadow=true;m.receiveShadow=true;return m}
function cyl(rt,rb,h,s,c){const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,s),M(c));m.castShadow=true;m.receiveShadow=true;return m}
</script>
<script src="../public/js/24-camper.js"></script>
<script src="../public/js/25-people.js"></script>
<script>
const stage=$('#stage'),scene=new T.Scene();scene.background=new T.Color(0xc8a376);
const camera=new T.PerspectiveCamera(36,1,0.1,100);camera.position.set(3,2.35,4.7);camera.lookAt(0,0.97,0);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;stage.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xffedce,0x75624d,0.65));
const sun=new T.DirectionalLight(0xffe6bd,1.1);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-4;sun.shadow.camera.right=4;sun.shadow.camera.top=5;sun.shadow.camera.bottom=-3;scene.add(sun);
const floor=new T.Mesh(new T.CylinderGeometry(2.2,2.2,0.1,32),M(0xb18b60));floor.position.y=-0.07;floor.receiveShadow=true;scene.add(floor);
const p=makePerson({camper:true,skin:0xe0b48f,band:0x446e78});scene.add(p.g);
let mode=0,last=performance.now(),elapsed=0,dragging=false,dragX=0,rot=0;
$('#actions').onclick=e=>{const b=e.target.closest('button[data-mode]');if(!b)return;mode=+b.dataset.mode;for(const el of document.querySelectorAll('button[data-mode]'))el.classList.toggle('on',el===b)};
stage.addEventListener('pointerdown',e=>{dragging=true;dragX=e.clientX;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(dragging){rot+=(e.clientX-dragX)*0.008;dragX=e.clientX}});
stage.addEventListener('pointerup',()=>dragging=false);
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;elapsed+=dt;
  const digPhase=(elapsed%1.4)/1.4;animPerson(p,mode,dt,digPhase,1);
  p.g.rotation.y=rot;p.g.position.y=(mode===1||mode===4)?Math.abs(Math.sin(p.ph))*0.028:0;
  const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.position.set(3,2.35,4.7*(h>w?1.28:1));camera.lookAt(0,0.97,0);camera.updateProjectionMatrix();renderer.render(scene,camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
